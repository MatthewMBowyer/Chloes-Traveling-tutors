	<body class="is-preload">

		<div id="site-header"></div>

		<div id="wrapper" class="divided">

			<section class="ctt-section ctt-page-top ctt-section-light">
				<div class="ctt-inner">
					<div class="ctt-section-title">
						<h1>Become a Tutor</h1>
						<p>
							Join the Chloe's Travelling Tutors team. Tell us the subjects and grades you
							teach and where you can help, and we will be in touch.
						</p>
					</div>

					<div class="ctt-contact-buttons">
						<a href="https://wa.me/27732657260" target="_blank" rel="noopener" class="button primary">
							WhatsApp us
						</a>

						<a href="mailto:cttfeatherbrooke@gmail.com" target="_blank" rel="noopener" class="button secondary">
							Email us
						</a>
					</div>
				</div>
			</section>

			<section class="ctt-section">
				<div class="ctt-inner">
					<div class="ctt-form">
						<form id="tutorApplicationForm">
							<div class="fields">
								<div class="field half">
									<label for="fullName">Name and surname</label>
									<input type="text" id="fullName" name="fullName" required />
								</div>

								<div class="field half">
									<label for="email">Email address</label>
									<input type="email" id="email" name="email" />
								</div>

								<div class="field half">
									<label for="phone">Phone number</label>
									<input type="tel" id="phone" name="phone" />
								</div>

								<div class="field half">
									<label for="universityQualification">University qualification</label>
									<input type="text" id="universityQualification" name="universityQualification" placeholder="Example: BSc Mathematics, University of Cape Town" required />
								</div>

								<div class="field half">
									<label for="subjectsToTeach">Subjects you want to teach</label>
									<input type="text" id="subjectsToTeach" name="subjectsToTeach" placeholder="Example: Mathematics and Physical Sciences" required />
								</div>

								<div class="field half">
									<label for="gradesToTeach">Grades you want to teach</label>
									<input type="text" id="gradesToTeach" name="gradesToTeach" placeholder="Example: Grades 8 to 12" required />
								</div>

								<div class="field half">
									<label for="teachingMode">Where you want to teach</label>
									<select id="teachingMode" name="teachingMode" required>
										<option value="">Select option</option>
										<option value="Online">Online</option>
										<option value="Willing to drive">Willing to drive</option>
										<option value="Both">Both</option>
									</select>
								</div>

								<div class="field half">
									<label for="teachingArea">Area</label>
									<input type="text" id="teachingArea" name="teachingArea" placeholder="Example: Roodepoort, or online" required />
								</div>

								<div class="field">
									<label for="reasonToTeach">Why you want to become a tutor</label>
									<textarea id="reasonToTeach" name="reasonToTeach" rows="6" required></textarea>
								</div>

								<div class="field">
									<p class="ctt-application-help">You can send your matric certificate and driver's licence to us on WhatsApp after you submit this form.</p>
								</div>

								<div class="field">
									<label for="otherQuestions">Any other relevant questions (optional)</label>
									<textarea id="otherQuestions" name="otherQuestions" rows="4"></textarea>
								</div>
							</div>

							<ul class="actions special">
								<li>
									<button type="submit" class="button primary">
										Send application on WhatsApp
									</button>
								</li>
							</ul>

							<p class="ctt-application-note" role="status" hidden></p>
						</form>
					</div>
				</div>
			</section>
